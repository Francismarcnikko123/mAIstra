# ============================================================================
# PINNED REFERENCE — exact training config used for the mAIstra OCR fine-tune
# ============================================================================
# This is the native PaddleOCR recognition config
#   configs/rec/PP-OCRv6/PP-OCRv6_medium_rec.yml
# exactly as it shipped in the PaddleOCR repo cloned on Colab on 2026-08-30,
# the run that produced the fine-tuned model (held-out CER 0.274 -> 0.126).
#
# WHY THIS FILE EXISTS: the live training run (notebooks/finetune_ppocrv6_rec_colab.ipynb,
# "Cell B") calls `tools/train.py -c configs/rec/PP-OCRv6/PP-OCRv6_medium_rec.yml`,
# where that config lives INSIDE the freshly-cloned PaddleOCR repo on the
# ephemeral Colab VM -- it is never stored in this project. If PaddleOCR
# changes that file upstream, a future clone could train with a different
# recipe than the one that produced our result, with no record of the
# original. This pinned copy is that record. It is documentation /
# reproducibility reference, NOT read by any code here.
#
# Captured verbatim from the executed notebook's `!cat $CFG` cell output.
# Source of the recovered hyperparameters: docs/ocr/COLAB_SETUP_WORKING.md.
#
# ---------------------------------------------------------------------------
# TWO DEVIATIONS from this file that the actual run applied -- read these or
# you will misread the recipe:
#
# 1. max_text_length: upstream default is 25; the run PATCHED it to 100
#    (Part C of the notebook) because ~30% of our lines were longer than 25
#    chars (max 92) and would otherwise be silently dropped. This file below
#    already shows 100 (the value as run), NOT the upstream 25.
#
# 2. CLI `-o` overrides passed to tools/train.py at launch OVERRIDE the
#    values in this file. The run used:
#        Global.epoch_num=40            (this file's epoch_num: 100 was overridden)
#        Global.distributed=false       (this file's distributed: true was overridden)
#        Global.save_epoch_step=5
#        Global.eval_batch_step=[0,200]
#        Train.dataset.ratio_list=[1.0] (this file's ratio_list: 0.5 was overridden --
#                                        0.5 would have used only half our crops)
#        Train.loader.num_workers=2     (this file's 8 was overridden; Colab has ~2 CPUs)
#        Eval.loader.num_workers=2      (this file's 4 was overridden)
#        Global.pretrained_model=<local PP-OCRv6_medium_rec_pretrained.pdparams>
#        dataset data_dir / label_file_list pointed at /content/datasets/recognition
#
# EFFECTIVE recipe as actually run (file value -> effective value):
#   epoch_num           100  -> 40
#   distributed        true  -> false
#   Train ratio_list    0.5  -> 1.0
#   Train num_workers     8  -> 2
#   Eval  num_workers     4  -> 2
#   max_text_length      25  -> 100   (config patch, shown as 100 below)
#   Optimizer / lr / architecture / batch size: unchanged from this file.
# ============================================================================

Global:
  model_name: PP-OCRv6_medium_rec
  debug: false
  use_gpu: true
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/PP-OCRv6_medium_rec
  save_epoch_step: 10
  eval_batch_step: [0, 2000]
  cal_metric_during_train: true
  pretrained_model:
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: ppocr/utils/dict/ppocrv6_dict.txt
  max_text_length: &max_text_length 100
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: ./output/rec/predicts_ppocrv6_medium.txt
  d2s_train_image_shape: [3, 48, 320]


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-05


Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 192
            depth: 2
            mlp_ratio: 4.0
            local_kernel: 7
            use_guide: false
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 512
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: ./train_data/
    ext_op_transform_idx: 1
    label_file_list:
    - ./train_data/train_list.txt
    ratio_list:
    - 0.5
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 2
        image_shape: [48, 320, 3]
        max_text_length: *max_text_length
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 64
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data
    label_file_list:
    - ./train_data/val_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
