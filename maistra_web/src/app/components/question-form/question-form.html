<div>
  <h2>Create Question</h2>


  <div>
    <label>Question Name *</label><br>
    <input [(ngModel)]="questionName" placeholder="e.g. Skill Test 1A" />
  </div>

  
  <div>
    <label>Question Type *</label><br>
    <label>
      <input type="radio" [(ngModel)]="questionType" value="program" (change)="onTypeChange()">
      Write a Program
    </label>
    <label>
      <input type="radio" [(ngModel)]="questionType" value="function" (change)="onTypeChange()">
      Write a Function
    </label>
  </div>


  <div>
    <label>Question Text *</label><br>
    <textarea [(ngModel)]="questionText" rows="3" placeholder="Describe the problem..."></textarea>
  </div>

 
  <div>
    <label>Model Answer *</label><br>
    <textarea [(ngModel)]="modelAnswer" rows="6" placeholder="Enter correct C code..."></textarea>
  </div>

  
  <div>
    <label>Test Cases</label>
    <button (click)="addTestCase()">+ Add</button>

    <div *ngFor="let tc of testCases; let i = index"
         style="margin-top: 12px; border: 1px solid #ccc; padding: 12px; border-radius: 6px;">

      <p>Test Case {{ i + 1 }}
        <button (click)="removeTestCase(i)">Remove</button>
      </p>

      
      <label>Test Code</label><br>
      <textarea [(ngModel)]="tc.test_code" rows="3" placeholder="Test code..."></textarea><br>

      
      <label>Expected Output</label><br>
      <input [(ngModel)]="tc.expected_output" placeholder="e.g. Well ordered" /><br>

      
      <label>Mark</label><br>
      <input type="number" [(ngModel)]="tc.mark" style="width: 80px;" />

    </div>
  </div>

 
  <div *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</div>
  <div *ngIf="successMessage" style="color: green;">{{ successMessage }}</div>

  
  <button (click)="save()" [disabled]="isSaving">
    {{ isSaving ? 'Saving...' : 'Save Question' }}
  </button>

</div>
