<div class="form-container">
  <h2>Create Question</h2>

  <!-- Question Name -->
  <div class="form-group">
    <label>Question Name *</label>
    <input type="text" [(ngModel)]="questionName" placeholder="e.g. Skill Test 1A" />
  </div>

  <!-- Question Type -->
  <div class="form-group">
    <label>Question Type *</label>
    <div class="radio-group">
      <label>
        <input type="radio" [(ngModel)]="questionType" value="program" (change)="onTypeChange()">
        Write a Program
      </label>
      <label>
        <input type="radio" [(ngModel)]="questionType" value="function" (change)="onTypeChange()">
        Write a Function
      </label>
    </div>
  </div>

  <!-- Question Text -->
  <div class="form-group">
    <label>Question Text *</label>
    <textarea [(ngModel)]="questionText" rows="3" placeholder="Describe the problem..."></textarea>
  </div>

  <!-- Model Answer -->
  <div class="form-group">
    <label>Model Answer *</label>
    <textarea [(ngModel)]="modelAnswer" rows="6" placeholder="Enter correct C code..."></textarea>
  </div>

  <!-- Test Cases -->
  <div class="test-cases-header">
    <span>Test Cases</span>
    <button class="btn-add" (click)="addTestCase()">+ Add</button>
  </div>

  <div class="test-case-card" *ngFor="let tc of testCases; let i = index">
    <div class="test-case-header">
      <span>Test Case {{ i + 1 }}</span>
      <button class="btn-remove" (click)="removeTestCase(i)">Remove</button>
    </div>

    <div class="form-group">
      <label>Test Code</label>
      <textarea [(ngModel)]="tc.test_code" rows="3" placeholder="Test code..."></textarea>
    </div>

    <div class="form-group">
      <label>Expected Output</label>
      <input type="text" [(ngModel)]="tc.expected_output" placeholder="e.g. 8" />
    </div>

    <div class="form-group">
      <label>Mark</label>
      <input type="number" [(ngModel)]="tc.mark" style="width: 80px;" />
    </div>
  </div>

  <!-- Messages -->
  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>

  <!-- Save -->
  <button class="btn-save" (click)="save()" [disabled]="isSaving">
    {{ isSaving ? 'Saving...' : 'Save Question' }}
  </button>

</div>
