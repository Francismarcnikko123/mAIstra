<div>
  <h2>Captured Papers <span style="color: green; font-size: 13px;">● LIVE</span></h2>

  <div *ngIf="isLoading">Loading...</div>

  <div *ngIf="!isLoading && submissions.length === 0">
    No submissions yet. Capture a paper from the mobile app.
  </div>

  <div
    *ngFor="let s of submissions"
    style="border: 1px solid #ccc; padding: 16px; margin-bottom: 20px; border-radius: 8px; background: white;"
  >

    <img
      [src]="s.image_url"
      style="width: 100%; max-height: 250px; object-fit: cover; border-radius: 6px;"
    />

    <p><strong>Student:</strong> {{ s.student_name || 'Unknown' }}</p>
    <p><strong>Status:</strong> {{ s.status | uppercase }}</p>
    <p><strong>Captured:</strong> {{ formatDate(s.captured_at) }}</p>

  
    <button
      type="button"
      (click)="extractText(s)"
      [disabled]="extractingId === s.id"
      style="padding: 8px 12px; margin-bottom: 12px;"
    >
      {{ extractingId === s.id ? 'Extracting...' : 'Extract Text' }}
    </button>

 
    <div *ngIf="editableText[s.id] !== undefined">
      <label><strong>Extracted Code / Verified Code</strong></label>

      <textarea
        [(ngModel)]="editableText[s.id]"
        rows="12"
        style="width: 100%; font-family: monospace; padding: 10px; margin-top: 8px;"
        placeholder="OCR result will appear here. Teacher can edit before saving."
      ></textarea>

    
      <button
        type="button"
        (click)="saveVerifiedText(s)"
        [disabled]="savingId === s.id || !editableText[s.id]"
        style="padding: 8px 12px; margin-top: 10px;"
      >
        {{ savingId === s.id ? 'Saving...' : 'Save Verified Text' }}
      </button>
    </div>
  </div>
</div>
