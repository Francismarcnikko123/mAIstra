<div class="submissions-panel">
  <div class="panel-header">
    <h2>Submissions</h2>
    <span class="total-count">{{ submissions.length }} total</span>
  </div>

  <div class="folders-container" *ngIf="groupedSubmissions.length > 0; else empty">
    <div class="folder" *ngFor="let group of groupedSubmissions">
      <div class="folder-header" (click)="toggleFolder(group.topic)">
        <span class="folder-arrow" [class.collapsed]="collapsedFolders[group.topic]">▾</span>
        <span class="folder-icon">📁</span>
        <span class="folder-name">{{ group.topic }}</span>
        <span class="folder-count">{{ group.submissions.length }}</span>
      </div>

      <div class="folder-content" [class.hidden]="collapsedFolders[group.topic]">
        <div class="thumbnails-grid">
          <div
            class="thumbnail-card"
            *ngFor="let s of group.submissions"
            (click)="openModal(s)"
          >
            <img [src]="s.image_url" alt="Submission" />
            <div class="thumb-badge" *ngIf="s.verified_text || s.extracted_text">✓</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #empty>
    <div class="empty-state">No submissions yet.</div>
  </ng-template>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" *ngIf="selectedSubmission" (click)="closeModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="closeModal()">✕</button>

    <div class="modal-body">
      <!-- Left: Image -->
      <div class="modal-image-section">
        <a [href]="selectedSubmission.image_url" target="_blank">
          <img [src]="selectedSubmission.image_url" alt="Submission" class="modal-image" />
        </a>
        <p class="modal-date">{{ selectedSubmission.captured_at | date:'medium' }}</p>
      </div>

      <!-- Right: Controls -->
      <div class="modal-controls">

        <!-- Topic Assignment -->
        <div class="control-group">
          <label>Topic / Folder</label>
          <div class="topic-row">
            <input
              class="topic-input"
              [(ngModel)]="editableTopic"
              placeholder="e.g. Algebra, Chapter 3"
            />
            <button class="btn-save-topic" (click)="saveTopic()" [disabled]="savingTopic">
              {{ savingTopic ? 'Saving…' : 'Assign' }}
            </button>
          </div>
        </div>

        <!-- Extract Text -->
        <div class="control-group">
          <label>Extracted Text</label>
          <button
            class="btn-extract"
            (click)="extractText()"
            [disabled]="isExtracting(selectedSubmission.id)"
          >
            {{ isExtracting(selectedSubmission.id) ? 'Extracting…' : 'Extract Text' }}
          </button>

          <app-code-editor
            *ngIf="hasExtractedText(selectedSubmission.id)"
            class="text-editor"
            [(value)]="editableText[selectedSubmission.id]"
          ></app-code-editor>

          <button
            *ngIf="hasExtractedText(selectedSubmission.id)"
            class="btn-save-text"
            (click)="saveVerifiedText()"
            [disabled]="isSaving(selectedSubmission.id)"
          >
            {{ isSaving(selectedSubmission.id) ? 'Saving…' : 'Save Verified Text' }}
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
