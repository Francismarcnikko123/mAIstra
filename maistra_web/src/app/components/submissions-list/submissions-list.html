<div class="submissions-container">

  <!-- Header -->
  <div class="submissions-header">
    <h2>Captured Papers</h2>
    <span class="live-badge">● LIVE</span>
  </div>

  <!-- Loading -->
  <div class="loading-state" *ngIf="isLoading">Loading submissions...</div>

  <!-- Empty -->
  <div class="empty-state" *ngIf="!isLoading && submissions.length === 0">
    No submissions yet. Capture a paper from the mobile app.
  </div>

  <!-- Cards -->
  <div class="submission-card" *ngFor="let s of submissions">

    <!-- Image -->
    <img class="submission-image" [src]="s.image_url" alt="Submission" />

    <!-- Info row -->
    <div class="submission-info">
      <span class="student-name">{{ s.student_name || 'Unknown' }}</span>
      <span class="status-badge" [class.extracted]="s.status === 'extracted'">
        {{ s.status | uppercase }}
      </span>
      <span class="submission-date">{{ formatDate(s.captured_at) }}</span>
    </div>

    <!-- Extract button -->
    <button
      class="btn-extract"
      type="button"
      (click)="extractText(s)"
      [disabled]="extractingId === s.id"
    >
      {{ extractingId === s.id ? 'Extracting...' : 'Extract Text' }}
    </button>

    <!-- Code editor (shows after extraction) -->
    <div class="code-section" *ngIf="editableText[s.id] !== undefined">
      <label>Extracted Code / Verified Code</label>
      <app-code-editor
        [(value)]="editableText[s.id]"
        style="display: block;"
      ></app-code-editor>
      <button
        class="btn-save"
        type="button"
        (click)="saveVerifiedText(s)"
        [disabled]="savingId === s.id || !editableText[s.id]"
      >
        {{ savingId === s.id ? 'Saving...' : 'Save Verified Text' }}
      </button>
    </div>

  </div>
</div>
