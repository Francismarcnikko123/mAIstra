<div>
  <p>Code Execution</p>
  <app-code-editor [(value)]="codeToRun"></app-code-editor>
  <button
    class="execute-button"
    type="button"
    (click)="executeCode()"
    [disabled]="isRunning"
    [class.running]="isRunning"
  >
    <span class="spinner" *ngIf="isRunning"></span>
    <span>{{ isRunning ? 'Running...' : 'Execute' }}</span>
  </button>

  <div
    class="gdb-console"
    *ngIf="isRunning || stdout || stderr || compileOutput || statusDescription"
  >
    <div class="gdb-console-header">
      <span class="gdb-tab active">Output</span>

      <span
        class="gdb-status"
        [class.success]="statusDescription === 'Accepted'"
        [class.error]="compileOutput || stderr"
        [class.running]="isRunning"
      >
        {{ isRunning ? 'Running' : statusDescription }}
      </span>
    </div>

    <div class="gdb-console-body">
      <pre *ngIf="isRunning" class="gdb-text running">
Compiling and running<span class="typing-dots"></span>
    </pre>

      <pre *ngIf="!isRunning && compileOutput" class="gdb-text error">
{{ compileOutput }}</pre>
      <pre *ngIf="!isRunning && stderr" class="gdb-text error">
{{ stderr }}</pre>
      <pre *ngIf="!isRunning && stdout" class="gdb-text output">
{{ stdout }}</pre>

      <pre
        *ngIf="!isRunning && !stdout && !stderr && !compileOutput && statusDescription"
        class="gdb-text muted"
      >
{{ statusDescription }}</pre>
    </div>
  </div>
</div>
