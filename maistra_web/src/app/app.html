<header class="topbar">
  <span class="brand">mAIstra</span>
  <nav class="topnav" aria-label="Main">
    <button
      type="button"
      [class.active]="page === 'bank' || page === 'create'"
      [attr.aria-current]="page === 'bank' || page === 'create' ? 'page' : null"
      (click)="page = 'bank'"
    >Question bank</button>
    <button
      type="button"
      [class.active]="page === 'submissions'"
      [attr.aria-current]="page === 'submissions' ? 'page' : null"
      (click)="page = 'submissions'"
    >Submissions</button>
  </nav>
</header>

<main class="page">
  <!-- Kept alive: the review keeps unsaved edits and its realtime updates.
       Hidden with an inline style because the component's :host sets display,
       which would override the [hidden] attribute. -->
  <div [style.display]="page === 'submissions' ? null : 'none'">
    <app-submissions-list #submissionsList></app-submissions-list>
  </div>

  <!-- Recreated each time so it reloads and shows newly saved questions. -->
  <app-question-bank
    *ngIf="page === 'bank'"
    (createQuestion)="page = 'create'"
  ></app-question-bank>

  <!-- Kept alive so a half-filled form survives a look elsewhere. -->
  <div [style.display]="page === 'create' ? null : 'none'">
    <button type="button" class="back-link" (click)="page = 'bank'">← Question bank</button>
    <!-- Refreshes the review's question picker, card labels and folders after a save (Jayrald). -->
    <app-question-form (questionSaved)="submissionsList.refreshQuestions()"></app-question-form>
  </div>
</main>
